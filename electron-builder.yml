appId: app.couchkit.desktop
productName: Couchkit
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - build/icon.png
  - package.json
mac:
  icon: build/icon.png
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
