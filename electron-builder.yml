appId: app.couchkit.desktop
productName: Couchkit
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - build/icon.png
  - package.json
mac:
  icon: build/icon.png
  # Ad-hoc signature (no Apple account needed). Apple-chip Macs refuse a completely unsigned app as "damaged";
  # with this, the person only sees the normal "unidentified developer" prompt and can press Open Anyway.
  identity: '-'
  hardenedRuntime: false
  extendInfo:
    NSLocalNetworkUsageDescription: Couchkit looks for Android TVs and Google TVs on your home network and talks to them to run the tools you choose.
    NSBonjourServices:
      - _adb._tcp
      - _adb-tls-connect._tcp
      - _adb-tls-pairing._tcp
      - _androidtvremote2._tcp
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
linux:
  syncDesktopName: true
  icon: build/icon.png
  category: Utility
  synopsis: A friendly toolbox for Google TV and Android TV
  maintainer: Steve Rozario <228487241+vistrocity@users.noreply.github.com>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
win:
  icon: build/icon.ico
  artifactName: Couchkit-${version}-win.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Couchkit-Setup-${version}.${ext}
portable:
  artifactName: Couchkit-${version}-portable.${ext}
