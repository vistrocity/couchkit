name: Build

# Quick checks run on every push and pull request (about a minute, one machine).
# The slow installer builds for macOS and Windows run only when a release tag
# (for example v0.1.0) is pushed, or when you press "Run workflow" by hand.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    name: Installer (${{ matrix.name }})
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Unsigned builds for now. See README, "Signing", for how to add certificates.
      - name: Package installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: couchkit-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create the release and attach the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la installers
          gh release create "${{ github.ref_name }}" installers/* \
            --repo "${{ github.repository }}" \
            --title "Couchkit ${{ github.ref_name }}" \
            --prerelease \
            --notes "First test release. Installers are not code-signed yet: on Mac use right-click, Open (or System Settings, Privacy and Security, Open Anyway); on Windows press More info, then Run anyway. Download adb separately from inside the app. See the README."
