name: Build

# Quick checks run on every push and pull request (about a minute, one machine).
# The slow installer build for Windows runs only when a release tag
# (for example v0.1.0) is pushed, or when you press "Run workflow" by hand.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Windows installer: built for every release tag (and on demand).
  package-windows:
    name: Installer (Windows)
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package installer
        run: npm run dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: couchkit-Windows
          path: dist/*.exe
          if-no-files-found: error

  # macOS installer: on demand only ("Run workflow") while the Mac release is on hold.
  # Not attached to releases. See README, "Mac".
  package-mac:
    name: Installer (macOS, manual)
    needs: check
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package installer
        run: npm run dist
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: couchkit-macOS
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create the release and attach the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la installers
          # If you already made the release by hand on GitHub, just attach the files to it.
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" installers/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "${{ github.ref_name }}" installers/* \
              --repo "${{ github.repository }}" \
              --title "Couchkit ${{ github.ref_name }}" \
              --prerelease \
              --notes "Windows installer. It is not code-signed yet: if SmartScreen warns, press More info, then Run anyway. The Mac version is on hold (see the README). adb is downloaded from inside the app."
          fi
